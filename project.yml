# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: Rivalift
options:
  bundleIdPrefix: app.rivalift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Rivalift:
    type: application
    platform: iOS
    sources:
      - path: Rivalift
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rivalift.ios
        PRODUCT_NAME: Rivalift
        INFOPLIST_FILE: Rivalift/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rivalift/App/Rivalift.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  RivaliftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RivaliftTests
    dependencies:
      - target: Rivalift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.rivalift.ios.tests
  RivaliftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RivaliftUITests
    dependencies:
      - target: Rivalift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.rivalift.ios.uitests
        TEST_TARGET_NAME: Rivalift
schemes:
  Rivalift:
    build:
      targets:
        Rivalift: all
    test:
      gatherCoverageData: true
      targets:
        - RivaliftTests
        - RivaliftUITests
    run:
      config: Debug
